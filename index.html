<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLP Wiki</title>
<script src="marked.min.js"></script>
<style>
  :root{
    --bg:#0f1114; --panel:#15181d; --panel2:#1b1f26; --line:rgba(255,255,255,.09);
    --tx:#e6e9ee; --tx-mut:#9aa3af; --acc:#84C84A; --acc-hi:#96DA5C; --r:12px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#eef1f4; --line:rgba(0,0,0,.10); --tx:#1a1d22; --tx-mut:#5b6572; --acc:#5aa22e; --acc-hi:#4f9127; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  a{color:var(--acc-hi);text-decoration:none}
  a:hover{text-decoration:underline}
  .top{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .brand{font-weight:800;letter-spacing:.02em}
  .brand b{color:var(--acc)}
  .search{margin-left:auto;flex:0 1 320px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--tx)}
  .wrap{display:grid;grid-template-columns:280px 1fr;gap:0;max-width:1200px;margin:0 auto}
  .side{border-right:1px solid var(--line);padding:18px 14px;height:calc(100vh - 57px);overflow:auto;position:sticky;top:57px}
  .cat{margin-bottom:14px}
  .cat__t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx-mut);font-weight:700;margin:6px 8px}
  .art{display:block;width:100%;text-align:left;padding:7px 10px;border:0;background:none;color:var(--tx);border-radius:8px;cursor:pointer;font:inherit}
  .art:hover{background:var(--panel2)}
  .art.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc-hi)}
  .main{padding:26px 34px;min-width:0;max-width:820px}
  .crumb{color:var(--tx-mut);font-size:13px;margin-bottom:10px}
  .content h1{margin-top:0}
  .content img,.content video{max-width:100%;border-radius:var(--r);border:1px solid var(--line)}
  .content pre{background:var(--panel);padding:12px 14px;border-radius:var(--r);overflow:auto}
  .content code{background:var(--panel);padding:1px 5px;border-radius:6px}
  .content blockquote{border-left:3px solid var(--acc);margin:14px 0;padding-left:14px;color:var(--tx-mut)}
  .ingame{display:inline-block;margin:6px 0;padding:5px 12px;border-radius:10px;background:var(--panel2);color:var(--tx-mut);font-size:13px;border:1px dashed var(--line)}
  .pn{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
  .pn a{padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:var(--tx)}
  @media(max-width:760px){.wrap{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><b>VLP</b> Wiki</div>
    <input id="q" class="search" type="text" placeholder="Поиск по вики…" autocomplete="off">
  </div>
  <div class="wrap">
    <aside class="side"><div id="tree"></div></aside>
    <main class="main">
      <div id="crumb" class="crumb"></div>
      <div id="content" class="content">Загрузка…</div>
      <div id="pn" class="pn"></div>
    </main>
  </div>
<script>
"use strict";
let MAN=null, FLAT=[], CUR=null, CACHE={};
const $=id=>document.getElementById(id);
async function get(p){const r=await fetch(p,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.text();}
function transform(html){
  return html
    .replace(/<a\s+href="vlp:([a-z0-9_-]+)"\s*>(.*?)<\/a>/gi,(_m,_s,t)=>`<span class="ingame">${t} — доступно в игре (F2)</span>`)
    .replace(/<a\s+href="wiki:([a-z0-9_\/-]+)"\s*>(.*?)<\/a>/gi,(_m,ref,t)=>`<a data-w="${ref}" href="#${ref}">${t}</a>`);
}
async function boot(){
  try{ MAN=JSON.parse(await get("manifest.json")); }
  catch(e){ $("content").innerHTML="Не удалось загрузить вики."; return; }
  FLAT=MAN.categories.flatMap(c=>c.articles.map(a=>({cat:c.id,catTitle:c.title,slug:a.slug,title:a.title,file:a.file})));
  tree("");
  const h=location.hash.slice(1); const m=FLAT.find(a=>h===a.cat+"/"+a.slug);
  open_(m||FLAT[0]);
}
function tree(q){
  q=(q||"").trim().toLowerCase();
  $("tree").innerHTML=MAN.categories.map(c=>{
    const arts=c.articles.filter(a=>!q||a.title.toLowerCase().includes(q));
    if(q&&!arts.length)return "";
    return `<div class="cat"><div class="cat__t">${c.title}</div>`+arts.map(a=>
      `<button class="art${CUR&&CUR.cat===c.id&&CUR.slug===a.slug?" on":""}" data-w="${c.id}/${a.slug}">${a.title}</button>`).join("")+`</div>`;
  }).join("");
}
async function open_(art){
  if(!art)return; CUR=art; location.hash=art.cat+"/"+art.slug;
  $("crumb").textContent=art.catTitle+" › "+art.title;
  try{ if(!CACHE[art.file])CACHE[art.file]=await get(art.file); $("content").innerHTML=transform(marked.parse(CACHE[art.file],{breaks:true,gfm:true})); }
  catch(e){ $("content").innerHTML="Статья недоступна."; }
  window.scrollTo(0,0); tree($("q").value);
  const i=FLAT.indexOf(art),p=FLAT[i-1],n=FLAT[i+1];
  $("pn").innerHTML=(p?`<a data-w="${p.cat}/${p.slug}" href="#${p.cat}/${p.slug}">← ${p.title}</a>`:"<span></span>")+
                   (n?`<a data-w="${n.cat}/${n.slug}" href="#${n.cat}/${n.slug}">${n.title} →</a>`:"<span></span>");
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-w]");if(el){e.preventDefault();const[c,s]=el.dataset.w.split("/");open_(FLAT.find(a=>a.cat===c&&a.slug===s));}});
document.addEventListener("input",e=>{if(e.target.id==="q")tree(e.target.value);});
boot();
</script>
</body>
</html>
